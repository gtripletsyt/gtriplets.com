<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gtrip's site</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }
    body {
      background: linear-gradient(-45deg, #0f172a, #1e3a8a, #7c3aed, #0ea5e9);
      background-size: 400% 400%;
      animation: gradientMove 15s ease infinite;
      min-height: 100vh;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .hero { max-width: 700px; padding: 20px; }
    h1 { font-size: 3rem; margin-bottom: 20px; }
    p { font-size: 1.2rem; line-height: 1.6; margin-bottom: 30px; opacity: 0.9; }
    .btn {
      display: inline-block;
      padding: 12px 28px;
      background: white;
      color: #4f46e5;
      text-decoration: none;
      border-radius: 999px;
      font-weight: bold;
      transition: 0.2s ease;
    }
    .btn:hover { transform: translateY(-3px); background: #f3f4f6; }

    .button-group {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 16px;
    }

    /* status + presence dropdown */
    .status-wrap {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      width: fit-content;
      margin: 24px auto 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }
    .status-dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #9ca3af;
    }
    .status-dot.online  { background: #23a55a; box-shadow: 0 0 6px #23a55a; }
    .status-dot.idle    { background: #f0b232; box-shadow: 0 0 6px #f0b232; }
    .status-dot.dnd     { background: #f23f43; box-shadow: 0 0 6px #f23f43; }
    .status-dot.offline { background: #80848e; }

    .presence-toggle {
      background: none;
      border: none;
      color: white;
      opacity: 0.75;
      cursor: pointer;
      font-size: 0.85rem;
      padding: 2px 6px;
      display: inline-flex;
      align-items: center;
      gap: 3px;
    }
    .presence-toggle:hover { opacity: 1; }
    .presence-toggle .chevron {
      display: inline-block;
      transition: transform 0.15s ease;
      font-size: 0.7rem;
    }
    .presence-toggle.open .chevron { transform: rotate(180deg); }

    .presence-panel {
      position: absolute;
      top: 130%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 12px 16px;
      min-width: 220px;
      font-size: 0.85rem;
      text-align: left;
      display: none;
      z-index: 10;
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }
    .presence-panel.show { display: block; }
    .presence-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
    .presence-row:last-child { margin-bottom: 0; }
    .presence-label { opacity: 0.7; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
    .presence-activity { font-weight: bold; }
    .presence-detail { opacity: 0.8; font-size: 0.8rem; }
  
    
.music-player {
  max-width: 390px;
  width: 100%;
  margin: 25px auto 0;
  padding: 16px;
  background: rgba(15, 23, 42, 0.55);
  border: 1px solid rgba(255,255,255,0.18);
  border-radius: 16px;
  backdrop-filter: blur(12px);
  text-align: left;
  box-shadow: 0 8px 25px rgba(0,0,0,0.2);
}

.music-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
}


.music-art {
  width: 45px;
  height: 45px;
  flex-shrink: 0;
  border-radius: 8px;
  background: linear-gradient(135deg, #7c3aed, #0ea5e9);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 21px;
  overflow: hidden;
  position: relative;
}

.music-art img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  position: absolute;
  inset: 0;
  z-index: 1;
}

.music-art img[src=""] {
  display: none;
}

#musicFallback {
  z-index: 0;
}
.music-info {
  min-width: 0;
}

.music-label {
  font-size: 0.7rem;
  opacity: 0.65;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.music-title {
  font-size: 1rem;
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.music-controls {
  display: flex;
  align-items: center;
  gap: 12px;
}

.music-play {
  width: 42px;
  height: 42px;
  border: none;
  border-radius: 50%;
  background: white;
  color: #4f46e5;
  font-size: 18px;
  cursor: pointer;
  flex-shrink: 0;
  transition: transform 0.2s;
}

.music-play:hover {
  transform: scale(1.08);
}

.music-timeline {
  flex: 1;
  min-width: 0;
}

.music-progress {
  width: 100%;
  accent-color: white;
  cursor: pointer;
}

.music-times {
  display: flex;
  justify-content: space-between;
  font-size: 0.7rem;
  opacity: 0.7;
  margin-top: 3px;
}

.music-error {
  font-size: 0.8rem;
  opacity: 0.75;
  margin-top: 8px;
}
  </style>
</head>
<body>
  <section class="hero">
    <h1>welcome to my website 👋</h1>
    <p>
      this website is a work in progress. expect things to be broken.
      <br><br>
      🎮 more stuff coming soon!
    </p>
      <a href="/games" class="btn">
        check out my games (some with cheats 👀 )
      </a>
    </div>
    
<div class="music-player">
  <div class="music-header">
    <div class="music-art">
  <img id="musicArt" src="" alt="song cover">
  <span id="musicFallback">🎵</span>
  </div>
    <div class="music-info">
      <div class="music-label">LATEST RELEASE</div>
      <div class="music-title" id="musicTitle">Loading song...</div>
    </div>


  <div class="music-controls">
    <button class="music-play" id="musicPlay" aria-label="Play song">▶</button>

    <div class="music-timeline">
      <input
        type="range"
        class="music-progress"
        id="musicProgress"
        min="0"
        max="100"
        value="0"
        step="0.1"
        aria-label="Song progress"
      >
      <div class="music-times">
        <span id="musicCurrent">0:00</span>
        <span id="musicDuration">0:00</span>
      </div>
    </div>
  </div>

  <div class="music-error" id="musicError"></div>

  <audio id="musicAudio" preload="metadata"></audio>
</div>

    <div class="status-wrap">
      <span class="status-dot" id="statusDot"></span>
      <span id="status">checking...</span>
      <button class="presence-toggle" id="presenceToggle">
        what am I doing <span class="chevron">▾</span>
      </button>

      <div class="presence-panel" id="presencePanel">
        <div id="discordActivity"></div>
      </div>
    </div>
  </section>

  <script>
    // ===== Discord presence (via Lanyard) =====
    const NAME = "gtrip";
    const DISCORD_USER_ID = "914563340234280970";
    const LANYARD_URL = `https://api.lanyard.rest/v1/users/${DISCORD_USER_ID}`;
    const CHECK_INTERVAL = 30000;

    const STATUS_LABELS = {
      online: "online",
      idle: "idle",
      dnd: "do not disturb",
      offline: "offline"
    };

    async function fetchPresence() {
      const dot = document.getElementById("statusDot");
      const statusText = document.getElementById("status");
      const activityEl = document.getElementById("discordActivity");

      try {
        const res = await fetch(LANYARD_URL);
        const json = await res.json();
        if (!json.success) throw new Error("lanyard request failed");
        const data = json.data;

        const discordStatus = data.discord_status || "offline";
        dot.className = `status-dot ${discordStatus}`;
        statusText.textContent = `${NAME} is ${STATUS_LABELS[discordStatus] || "offline"}`;

        const activities = (data.activities || []).filter(a => a.type !== 4);
        activityEl.innerHTML = "";

        if (data.listening_to_spotify && data.spotify) {
          const row = document.createElement("div");
          row.className = "presence-row";
          row.innerHTML = `<span class="presence-label">Listening</span>`;
          const detail = document.createElement("div");
          detail.className = "presence-detail";
          detail.textContent = `🎵 ${data.spotify.song} — ${data.spotify.artist}`;
          activityEl.appendChild(row);
          activityEl.appendChild(detail);
        } else if (activities.length > 0) {
          const act = activities[0];
          const row = document.createElement("div");
          row.className = "presence-row";
          row.innerHTML = `<span class="presence-label">${act.type === 0 ? "Playing" : "Doing"}</span>`;
          const detail = document.createElement("div");
          detail.className = "presence-activity";
          detail.textContent = act.name;
          activityEl.appendChild(row);
          activityEl.appendChild(detail);
          if (act.details) {
            const sub = document.createElement("div");
            sub.className = "presence-detail";
            sub.textContent = act.details;
            activityEl.appendChild(sub);
          }
        } else {
          const row = document.createElement("div");
          row.className = "presence-detail";
          row.textContent = "Not doing anything in particular";
          activityEl.appendChild(row);
        }
      } catch (e) {
        statusText.textContent = `${NAME} is offline`;
        dot.className = "status-dot offline";
        activityEl.innerHTML = `<div class="presence-detail">Couldn't load presence</div>`;
      }
    }

    const toggleBtn = document.getElementById("presenceToggle");
    const panel = document.getElementById("presencePanel");
    let panelOpen = false;

    toggleBtn.addEventListener("click", () => {
      panelOpen = !panelOpen;
      panel.classList.toggle("show", panelOpen);
      toggleBtn.classList.toggle("open", panelOpen);
      if (panelOpen) fetchPresence();
    });

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".status-wrap") && panelOpen) {
        panelOpen = false;
        panel.classList.remove("show");
        toggleBtn.classList.remove("open");
      }
    });

    fetchPresence();
    setInterval(fetchPresence, CHECK_INTERVAL);
  </script>
  <script>
const audio = document.getElementById("musicAudio");
const playBtn = document.getElementById("musicPlay");
const progress = document.getElementById("musicProgress");
const title = document.getElementById("musicTitle");
const currentTimeEl = document.getElementById("musicCurrent");
const durationEl = document.getElementById("musicDuration");
const errorEl = document.getElementById("musicError");

function formatTime(seconds) {
  if (!Number.isFinite(seconds)) return "0:00";
  const mins = Math.floor(seconds / 60);
  const secs = Math.floor(seconds % 60);
  return `${mins}:${String(secs).padStart(2, "0")}`;
}

async function loadLatestSong() {
  try {
    const response = await fetch("/api/latest-song", {
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error("Couldn't find a song");
    }

    const song = await response.json();

    title.textContent = song.title;
audio.src = song.url;

const art = document.getElementById("musicArt");
const fallback = document.getElementById("musicFallback");

if (song.art) {
  art.src = song.art;
  art.style.display = "block";
  fallback.style.display = "none";

  art.onerror = () => {
    art.style.display = "none";
    fallback.style.display = "block";
  };
} else {
  art.removeAttribute("src");
  art.style.display = "none";
  fallback.style.display = "block";
}

audio.load();
errorEl.textContent = "";
  } catch (error) {
    title.textContent = "No song available";
    errorEl.textContent = "Couldn't load the latest song.";
    playBtn.disabled = true;
  }
}

playBtn.addEventListener("click", async () => {
  if (audio.paused) {
    try {
      await audio.play();
    } catch (error) {
      errorEl.textContent = "Couldn't play this song.";
    }
  } else {
    audio.pause();
  }
});

audio.addEventListener("play", () => {
  playBtn.textContent = "❚❚";
  playBtn.setAttribute("aria-label", "Pause song");
});

audio.addEventListener("pause", () => {
  playBtn.textContent = "▶";
  playBtn.setAttribute("aria-label", "Play song");
});

audio.addEventListener("loadedmetadata", () => {
  durationEl.textContent = formatTime(audio.duration);
});

audio.addEventListener("timeupdate", () => {
  currentTimeEl.textContent = formatTime(audio.currentTime);

  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    progress.value = (audio.currentTime / audio.duration) * 100;
  }
});

progress.addEventListener("input", () => {
  if (Number.isFinite(audio.duration) && audio.duration > 0) {
    audio.currentTime = (Number(progress.value) / 100) * audio.duration;
  }
});

audio.addEventListener("ended", () => {
  playBtn.textContent = "▶";
  playBtn.setAttribute("aria-label", "Play song");
  progress.value = 0;
});

audio.addEventListener("error", () => {
  errorEl.textContent = "Unable to load this audio file.";
});

loadLatestSong();
  </script>
</body>
</html>
