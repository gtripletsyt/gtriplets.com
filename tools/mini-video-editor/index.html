<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Video Editor</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><h1>🎬 Mini Video Editor</h1><label class="btn">Import media<input id="mediaInput" type="file" hidden multiple accept="video/*,audio/*,image/*"></label><label class="btn">Photos → Video<input id="photoInput" type="file" hidden multiple accept="image/*"></label><button id="export" class="btn primary">Export</button></header>
<div class="layout"><aside><h2>Media</h2><div id="drop" class="drop">Drop videos, audio, or images here</div><div id="media"></div></aside><section class="stage"><video id="preview" controls></video><canvas id="canvas"></canvas><div id="progress"></div></section><aside class="inspector"><h2>Clip</h2><label>Name<input id="name"></label><div class="twocol"><label>Start<input id="start" type="number" min="0" step="0.01"></label><label>End<input id="end" type="number" min="0" step="0.01"></label></div><button id="apply" class="btn">Apply trim</button><button id="remove" class="btn danger">Delete clip</button><p id="status">Import media to start.</p></aside><section class="timeline"><h2>Timeline</h2><div id="track"></div></section></div>
<div id="photoDialog" class="dialog"><div class="dialogBox"><h2>Photos → Video</h2><label>FPS<input id="fps" type="number" min="1" max="120" value="30"></label><p id="photoCount"></p><div class="twocol"><button id="makePhotoVideo" class="btn primary">Create</button><button id="cancelPhoto" class="btn">Cancel</button></div><p id="photoStatus"></p></div></div>
<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js"></script><script src="https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/dist/umd/index.js"></script><script src="app.js"></script></body></html>
