<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FlipFrame — Simple Animation Editor</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color-scheme:light;--ink:#20242c;--gray:#777f8a;--line:#e4e7ec;--bg:#f5f6f8;--violet:#6d5ce7}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-size:13px}button,input,select{font:inherit}button{border:1px solid var(--line);background:white;border-radius:9px;color:var(--ink);padding:9px 12px;cursor:pointer;white-space:nowrap;font-weight:550}button:hover:not(:disabled){background:#f0edff;border-color:#c9c1fa}button:disabled{opacity:.38;cursor:not-allowed}.primary{background:var(--violet);color:white;border-color:var(--violet)}button.primary:hover:not(:disabled){background:#5547c6;color:white}.danger{color:#b34d53}button.selected{background:#eae6ff;border-color:var(--violet);color:#4232b1}.top{height:70px;padding:12px 22px;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid var(--line);gap:12px}.brand{font-weight:800;font-size:21px;letter-spacing:-.7px;display:flex;align-items:center;gap:9px;white-space:nowrap}.logo{width:31px;height:31px;background:var(--violet);border-radius:10px;color:white;display:grid;place-items:center}.top-actions,.transport,.timeline-buttons,.toolgrid,.brush-controls,.utility{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.top-actions{justify-content:flex-end}.workspace{max-width:1600px;margin:0 auto;padding:15px 22px 0}.toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:13px;background:white;border:1px solid var(--line);border-radius:13px;padding:11px 13px;margin-bottom:14px}.toolgrid{gap:4px}.toolgrid button{padding:8px 9px;display:flex;align-items:center;gap:6px}.toolgrid .symbol{font-size:18px;line-height:1}.bar-sep{width:1px;height:32px;background:var(--line);margin:0 3px}.brush-controls{gap:11px}.field{display:flex;align-items:center;gap:7px;color:#505866;white-space:nowrap}.field input[type=range]{width:90px;accent-color:var(--violet)}input[type=color]{width:31px;height:31px;border:0;background:transparent;padding:0;cursor:pointer}.field output{width:32px;color:#667085;font-size:12px}input[type=number]{width:58px;padding:7px 6px;background:white;border:1px solid var(--line);border-radius:8px}input[type=checkbox]{accent-color:var(--violet)}.secondary-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:0 0 11px}.settings-inline{display:flex;align-items:center;gap:15px;flex-wrap:wrap}.settings-inline label{display:flex;align-items:center;gap:6px}.stage-meta{font-size:12px;color:var(--gray)}.stage{background:#e9ecf1;border:1px solid #e0e4eb;border-radius:14px;min-height:330px;padding:22px;display:flex;align-items:center;justify-content:center;overflow:hidden}.canvas-wrap{position:relative;width:min(100%,1000px);aspect-ratio:16/9;background:white;box-shadow:0 9px 28px #353b4c1a;border:1px solid #d9dce6;touch-action:none;overflow:hidden}.canvas-wrap canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#drawCanvas{z-index:1;cursor:crosshair}#onionCanvas{z-index:2;pointer-events:none}.footer-controls{display:flex;align-items:center;justify-content:center;gap:14px;min-height:66px;flex-wrap:wrap}.transport .readout{font-size:12px;color:var(--gray);min-width:55px;text-align:center}.transport button{min-width:42px}.status{color:#737d8b;text-align:center;font-size:12px;min-height:18px;margin-bottom:12px}.timeline{background:white;border-top:1px solid var(--line);padding:16px 22px 20px;margin-top:8px}.timeline-inner{max-width:1600px;margin:auto}.timelineheader{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:10px}.timelineheader h2{font-size:15px;margin:0;letter-spacing:-.2px}.frames{display:flex;gap:9px;overflow-x:auto;padding:4px 1px 12px;min-height:105px}.frame{position:relative;flex:0 0 112px;border:2px solid var(--line);border-radius:9px;background:#fafafa;padding:5px;text-align:left;cursor:pointer}.frame.active{border-color:var(--violet);background:#f3f0ff}.frame .thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:white;border-radius:4px}.frame .number{display:flex;justify-content:space-between;font-size:11px;color:#667085;margin-top:4px}.frame .time{color:#9ba1ab}.more{position:relative}.more summary{list-style:none;cursor:pointer;border:1px solid var(--line);background:white;border-radius:9px;padding:8px 12px;font-weight:600;white-space:nowrap}.more summary::-webkit-details-marker{display:none}.more[open] summary{border-color:#a89bfa;background:#f4f1ff}.more-panel{position:absolute;right:0;top:calc(100% + 9px);width:min(310px,calc(100vw - 40px));background:white;border:1px solid var(--line);border-radius:13px;box-shadow:0 15px 40px #20242c22;padding:17px;z-index:10}.more-panel h3{margin:4px 0 12px;font-size:13px}.more-panel .setting{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0}.more-panel .setting input[type=range]{width:135px;accent-color:var(--violet)}.more-panel .setting-actions{display:grid;gap:7px}.more-panel .setting-actions button{text-align:left}.more-panel hr{border:0;border-top:1px solid var(--line);margin:15px 0}.notice{font-size:11px;color:var(--gray);line-height:1.5;margin:8px 0}.export-progress{display:none;font-size:12px;color:#5145a5}.export-progress.active{display:block}#fileInput,#projectInput{display:none}.hint{font-size:11px;color:var(--gray)}.mobile-label{display:none}
@media(max-width:950px){.top{height:auto;flex-wrap:wrap}.workspace{padding:12px 12px 0}.toolbar{gap:9px}.bar-sep{display:none}.stage{min-height:260px;padding:12px}.timeline{padding:14px 12px}.field input[type=range]{width:75px}}@media(max-width:580px){.top{padding:10px 12px}.top-actions button{padding:8px 9px}.brand{font-size:19px}.toolbar{padding:9px}.toolgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}.toolgrid button{justify-content:center}.brush-controls{width:100%;justify-content:space-between}.utility{width:100%;justify-content:flex-end}.stage{padding:6px;min-height:200px}.settings-inline{gap:10px}.footer-controls{gap:5px}.frame{flex-basis:100px}.timeline-buttons{gap:5px}.timeline-buttons button{padding:7px 8px}.hint{display:none}}
</style></head><body>
<header class="top"><div class="brand"><span class="logo">✦</span>FlipFrame</div><div class="top-actions"><button id="importBtn">＋ Import images</button><button id="saveProjectBtn">Save</button><button id="loadProjectBtn">Open</button><button class="primary" id="exportBtn">⬇ Export video</button></div></header>
<div class="workspace">
<div class="toolbar"><div class="toolgrid" id="tools">
<button data-tool="pencil" class="selected" title="Pencil (B)"><span class="symbol">✎</span>Pencil</button>
<button data-tool="marker" title="Marker (M)"><span class="symbol">▰</span>Marker</button>
<button data-tool="spray" title="Spray (S)"><span class="symbol">⁙</span>Spray</button>
<button data-tool="eraser" title="Eraser (E)"><span class="symbol">◩</span>Eraser</button>
<button data-tool="line" title="Line (L)"><span class="symbol">／</span>Line</button>
<button data-tool="rectangle" title="Rectangle (R)"><span class="symbol">▢</span>Rectangle</button>
</div><div class="bar-sep"></div>
<div class="brush-controls"><label class="field" for="color">Color <input type="color" id="color" value="#7b66ff"></label><label class="field" for="size">Size <input type="range" id="size" min="1" max="90" value="8"><output id="sizeOut">8 px</output></label><label class="field" for="opacity">Opacity <input type="range" id="opacity" min="5" max="100" value="100"><output id="opacityOut">100%</output></label></div>
<div class="utility"><button id="undoBtn" title="Undo (Ctrl/⌘ Z)">↶ Undo</button><button id="redoBtn" title="Redo">↷ Redo</button></div></div>
<div class="secondary-toolbar"><div class="settings-inline"><label for="fps">FPS <input type="number" min="1" max="60" id="fps" value="12"></label><label for="onion"><input type="checkbox" id="onion" checked> Onion skin</label><label for="loop"><input type="checkbox" id="loop" checked> Loop</label></div><div style="display:flex;align-items:center;gap:10px"><span class="stage-meta" id="currentName">Frame 1</span><details class="more"><summary>More options ▾</summary><div class="more-panel"><h3>Drawing & frame options</h3><div class="setting"><label for="onionOpacity">Onion opacity <span id="onionOpacityOut">25%</span></label><input type="range" id="onionOpacity" min="5" max="60" value="25"></div><div class="setting-actions"><button id="clearBtn">Clear current frame</button><button id="fillBtn">Fill frame with color</button><button id="downloadFrameBtn">Save frame as PNG</button></div><hr><p class="notice">WebM video export uses your selected FPS. Imported images become new frames. Keyboard: Space to play, arrow keys for frames, B for pencil, E for eraser.</p><div id="exportProgress" class="export-progress" aria-live="polite"></div></div></details></div></div>
<div class="stage"><div class="canvas-wrap" id="canvasWrap"><canvas id="onionCanvas" width="960" height="540"></canvas><canvas id="drawCanvas" width="960" height="540"></canvas></div></div>
<div class="footer-controls"><div class="transport"><button id="firstBtn" title="First frame">⇤</button><button id="prevBtn" title="Previous frame">←</button><button id="playBtn" class="primary">▶ Play</button><button id="nextBtn" title="Next frame">→</button><button id="lastBtn" title="Last frame">⇥</button><span id="counter" class="readout">1 / 1</span></div><span class="hint">Draw, then duplicate a frame to animate.</span></div><div class="status" id="status" role="status" aria-live="polite"></div></div>
<section class="timeline"><div class="timeline-inner"><div class="timelineheader"><h2>Frames <span id="duration" style="font-weight:400;color:#848b97;font-size:12px">· 0.08 seconds</span></h2><div class="timeline-buttons"><button id="addBtn">＋ Add</button><button id="duplicateBtn">▣ Duplicate</button><button id="deleteBtn" class="danger">✕ Delete</button><button id="moveLeftBtn">← Move</button><button id="moveRightBtn">Move →</button></div></div><div class="frames" id="frames" aria-label="Animation frames"></div></div></section>
<input type="file" id="fileInput" accept="image/*" multiple><input type="file" id="projectInput" accept=".json,application/json">
<script>
(()=>{'use strict';
const W=960,H=540;
const $=id=>document.getElementById(id);
const drawing=$('drawCanvas'), dctx=drawing.getContext('2d',{willReadFrequently:true});
const onion=$('onionCanvas'), octx=onion.getContext('2d');
const makeCanvas=()=>{const c=document.createElement('canvas');c.width=W;c.height=H;return c};
const blank=()=>({canvas:makeCanvas(),undo:[],redo:[]});
let frames=[blank()],index=0,tool='pencil',color='#7b66ff',size=8,opacity=1,playing=false,playHandle=null,exporting=false,activePointer=null,begin=null,last=null,baseSnapshot=null;
const setStatus=(s)=>{$('status').textContent=s};
function fps(){const n=Math.round(Number($('fps').value)||12);return Math.max(1,Math.min(60,n))}
function updateTime(){ $('fps').value=fps(); $('duration').textContent=`· ${(frames.length/fps()).toFixed(2)} seconds`;}
function snapshot(){return frames[index].canvas.toDataURL('image/png')}
function restore(url,canvas,done){const im=new Image;im.onload=()=>{const c=canvas.getContext('2d');c.clearRect(0,0,W,H);c.drawImage(im,0,0,W,H);if(done)done()};im.src=url}
function remember(){const f=frames[index];f.undo.push(snapshot());if(f.undo.length>20)f.undo.shift();f.redo.length=0;syncUndo()}
function syncUndo(){$('undoBtn').disabled=!frames[index].undo.length;$('redoBtn').disabled=!frames[index].redo.length}
function drawView(){dctx.clearRect(0,0,W,H);dctx.fillStyle='#fff';dctx.fillRect(0,0,W,H);dctx.drawImage(frames[index].canvas,0,0);octx.clearRect(0,0,W,H);if($('onion').checked&&!playing&&index>0){octx.globalAlpha=Number($('onionOpacity').value)/100;octx.drawImage(frames[index-1].canvas,0,0);octx.globalAlpha=1}}
function thumbnail(canvas){const t=document.createElement('canvas');t.width=160;t.height=90;const c=t.getContext('2d');c.fillStyle='#fff';c.fillRect(0,0,160,90);c.drawImage(canvas,0,0,160,90);return t.toDataURL('image/jpeg',.75)}
function drawTimeline(){const list=$('frames');list.replaceChildren();frames.forEach((f,i)=>{const b=document.createElement('button');b.className='frame'+(i===index?' active':'');b.setAttribute('aria-label',`Go to frame ${i+1}`);b.setAttribute('aria-pressed',String(i===index));const pic=document.createElement('img');pic.className='thumb';pic.alt='';pic.src=thumbnail(f.canvas);const row=document.createElement('div');row.className='number';const num=document.createElement('span');num.textContent='Frame '+(i+1);const t=document.createElement('span');t.className='time';t.textContent=(i/fps()).toFixed(2)+'s';row.append(num,t);b.append(pic,row);b.onclick=()=>select(i);list.append(b)});$('counter').textContent=`${index+1} / ${frames.length}`;$('currentName').textContent=`Frame ${index+1}`;updateTime();syncUndo()}
function refresh(){drawView();drawTimeline()}
function select(i){if(exporting)return;if(activePointer!==null)return;stop();index=Math.max(0,Math.min(frames.length-1,i));refresh();document.querySelector('.frame.active')?.scrollIntoView({block:'nearest',inline:'nearest'})}
function insertFrame(copy=false){if(exporting)return;stop();const f=blank();if(copy)f.canvas.getContext('2d').drawImage(frames[index].canvas,0,0);frames.splice(index+1,0,f);index++;refresh();document.querySelector('.frame.active')?.scrollIntoView({block:'nearest',inline:'nearest'})}
function deleteFrame(){if(exporting)return;stop();if(frames.length===1){remember();frames[0].canvas.getContext('2d').clearRect(0,0,W,H)}else{frames.splice(index,1);index=Math.min(index,frames.length-1)}refresh()}
function moveFrame(offset){if(exporting)return;const j=index+offset;if(j<0||j>=frames.length)return;stop();[frames[index],frames[j]]=[frames[j],frames[index]];index=j;refresh()}
function undo(){if(exporting||!frames[index].undo.length)return;stop();const f=frames[index];f.redo.push(snapshot());restore(f.undo.pop(),f.canvas,refresh)}
function redo(){if(exporting||!frames[index].redo.length)return;stop();const f=frames[index];f.undo.push(snapshot());restore(f.redo.pop(),f.canvas,refresh)}
function coords(e){const r=drawing.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
function setBrush(ctx,erase=false){ctx.lineJoin='round';ctx.lineCap='round';ctx.lineWidth=size*(tool==='marker'?2.3:1);ctx.globalCompositeOperation=erase?'destination-out':'source-over';ctx.globalAlpha=erase?1:opacity*(tool==='marker'?.32:1);ctx.strokeStyle=erase?'#000':color;ctx.fillStyle=erase?'#000':color}
function spray(ctx,p){ctx.save();ctx.fillStyle=color;ctx.globalAlpha=opacity*.62;for(let i=0;i<Math.max(12,size*2);i++){const a=Math.random()*Math.PI*2,r=Math.sqrt(Math.random())*size*2.2;ctx.fillRect(p.x+Math.cos(a)*r,p.y+Math.sin(a)*r,Math.max(1,size/13),Math.max(1,size/13))}ctx.restore()}
function stroke(ctx,a,b){ctx.save();setBrush(ctx,tool==='eraser');if(tool==='spray'){const dist=Math.hypot(b.x-a.x,b.y-a.y),count=Math.max(1,Math.ceil(dist/Math.max(1,size/3)));for(let k=0;k<=count;k++)spray(ctx,{x:a.x+(b.x-a.x)*k/count,y:a.y+(b.y-a.y)*k/count})}else{ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}ctx.restore()}
function shape(ctx,a,b){ctx.save();setBrush(ctx);ctx.beginPath();if(tool==='line'){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y)}else{ctx.rect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y))}ctx.stroke();ctx.restore()}
drawing.addEventListener('pointerdown',e=>{if(playing||exporting||activePointer!==null)return;if(e.button!==0&&e.pointerType==='mouse')return;e.preventDefault();activePointer=e.pointerId;drawing.setPointerCapture(e.pointerId);remember();begin=last=coords(e);baseSnapshot=null;const c=frames[index].canvas.getContext('2d',{willReadFrequently:true});if(tool==='line'||tool==='rectangle')baseSnapshot=c.getImageData(0,0,W,H);else if(tool==='spray')spray(c,begin);else stroke(c,begin,begin);drawView()});
drawing.addEventListener('pointermove',e=>{if(activePointer!==e.pointerId)return;e.preventDefault();const p=coords(e),c=frames[index].canvas.getContext('2d',{willReadFrequently:true});if(baseSnapshot){c.putImageData(baseSnapshot,0,0);shape(c,begin,p)}else stroke(c,last,p);last=p;drawView()});
function endStroke(e){if(activePointer!==e.pointerId)return;activePointer=null;begin=last=baseSnapshot=null;drawView();drawTimeline()}
drawing.addEventListener('pointerup',endStroke);drawing.addEventListener('pointercancel',endStroke);
function stop(){if(playHandle!==null)clearTimeout(playHandle);playHandle=null;playing=false;$('playBtn').textContent='▶ Play';drawView()}
function play(){if(exporting)return;if(playing){stop();return}playing=true;$('playBtn').textContent='❚❚ Pause';const interval=1000/fps();let next=performance.now()+interval;const tick=()=>{if(!playing)return;if(index===frames.length-1&&!$('loop').checked){stop();refresh();return}index=(index+1)%frames.length;drawView();drawTimeline();const now=performance.now();next+=interval;playHandle=setTimeout(tick,Math.max(0,next-now))};playHandle=setTimeout(tick,interval)}
function download(blob,name){const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
async function importImages(files){if(exporting)return;stop();const imgs=Array.from(files).filter(f=>f.type.startsWith('image/'));if(!imgs.length)return;const added=[];for(const file of imgs){try{const url=URL.createObjectURL(file);const image=await new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>resolve(img);img.onerror=reject;img.src=url});const f=blank(),c=f.canvas.getContext('2d'),scale=Math.min(W/image.width,H/image.height);c.drawImage(image,(W-image.width*scale)/2,(H-image.height*scale)/2,image.width*scale,image.height*scale);URL.revokeObjectURL(url);added.push(f)}catch(err){console.warn('Could not open',file.name,err)}}if(added.length){frames.splice(index+1,0,...added);index++;refresh();setStatus(`Imported ${added.length} image${added.length===1?'':'s'} as new frames.`)}else setStatus('No images could be imported.');$('fileInput').value=''}
function saveProject(){if(exporting)return;const data={app:'FlipFrame',version:1,width:W,height:H,fps:fps(),frames:frames.map(f=>f.canvas.toDataURL('image/png'))};download(new Blob([JSON.stringify(data)],{type:'application/json'}),'flipframe-project.json');setStatus('Project saved as JSON.')}
async function openProject(file){if(!file||exporting)return;try{const data=JSON.parse(await file.text());if(data.app!=='FlipFrame'||!Array.isArray(data.frames)||!data.frames.length||data.frames.length>2000)throw Error('Invalid FlipFrame project');stop();const incoming=[];for(const url of data.frames){if(typeof url!=='string'||!url.startsWith('data:image/'))throw Error('Invalid image data');const f=blank();await new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>{f.canvas.getContext('2d').drawImage(im,0,0,W,H);resolve()};im.onerror=reject;im.src=url});incoming.push(f)}frames=incoming;index=0;$('fps').value=data.fps||12;refresh();setStatus('Project opened successfully.')}catch(err){setStatus('Could not open project: '+err.message)}$('projectInput').value=''}
async function exportVideo(){if(exporting)return;if(!window.MediaRecorder||typeof drawing.captureStream!=='function'){setStatus('Video export is not supported by this browser. Try Chrome or Edge.');return}stop();exporting=true;$('exportBtn').disabled=true;const progress=$('exportProgress');progress.classList.add('active');progress.textContent='Preparing video…';const initial=index;const rate=fps();const capture=makeCanvas(),ctx=capture.getContext('2d');const stream=capture.captureStream(0);const track=stream.getVideoTracks()[0];const manual=typeof track.requestFrame==='function';const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(m=>MediaRecorder.isTypeSupported(m));if(!mime){setStatus('WebM recording is unavailable in this browser.');progress.classList.remove('active');exporting=false;$('exportBtn').disabled=false;stream.getTracks().forEach(t=>t.stop());return}
const recorder=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:4000000}),chunks=[];recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
const finished=new Promise((resolve,reject)=>{recorder.onstop=resolve;recorder.onerror=e=>reject(e.error||Error('Recorder error'))});
try{recorder.start();const total=frames.length;const step=1000/rate;let deadline=performance.now();for(let i=0;i<total;i++){ctx.fillStyle='#fff';ctx.fillRect(0,0,W,H);ctx.drawImage(frames[i].canvas,0,0);index=i;drawView();drawTimeline();progress.textContent=`Recording frame ${i+1} of ${total}…`;if(manual)track.requestFrame();deadline+=step;await new Promise(r=>setTimeout(r,Math.max(0,deadline-performance.now())))}// A final moment ensures the last encoded frame arrives before stopping.
await new Promise(r=>setTimeout(r,Math.max(100,step)));recorder.stop();await finished;const blob=new Blob(chunks,{type:mime});if(!blob.size)throw Error('Video recording was empty');download(blob,'flipframe-animation.webm');setStatus(`Exported ${total} frames at ${rate} FPS as WebM.`)}catch(err){setStatus('Export failed: '+err.message);if(recorder.state!=='inactive')recorder.stop()}finally{stream.getTracks().forEach(t=>t.stop());index=initial;exporting=false;$('exportBtn').disabled=false;progress.classList.remove('active');refresh()}}
$('tools').addEventListener('click',e=>{const b=e.target.closest('[data-tool]');if(!b)return;tool=b.dataset.tool;document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('selected',x===b))});
$('color').oninput=e=>color=e.target.value;$('size').oninput=e=>{size=Number(e.target.value);$('sizeOut').textContent=size+' px'};$('opacity').oninput=e=>{opacity=Number(e.target.value)/100;$('opacityOut').textContent=e.target.value+'%'};
$('fps').onchange=()=>{updateTime();drawTimeline()};$('onion').onchange=drawView;$('onionOpacity').oninput=e=>{$('onionOpacityOut').textContent=e.target.value+'%';drawView()};
$('addBtn').onclick=()=>insertFrame(false);$('duplicateBtn').onclick=()=>insertFrame(true);$('deleteBtn').onclick=deleteFrame;$('moveLeftBtn').onclick=()=>moveFrame(-1);$('moveRightBtn').onclick=()=>moveFrame(1);$('undoBtn').onclick=undo;$('redoBtn').onclick=redo;
$('prevBtn').onclick=()=>select(index-1);$('nextBtn').onclick=()=>select(index+1);$('firstBtn').onclick=()=>select(0);$('lastBtn').onclick=()=>select(frames.length-1);$('playBtn').onclick=play;
$('clearBtn').onclick=()=>{if(exporting)return;stop();remember();frames[index].canvas.getContext('2d').clearRect(0,0,W,H);refresh()};
$('fillBtn').onclick=()=>{if(exporting)return;stop();remember();const c=frames[index].canvas.getContext('2d');c.save();c.globalAlpha=1;c.globalCompositeOperation='source-over';c.fillStyle=color;c.fillRect(0,0,W,H);c.restore();refresh()};
$('downloadFrameBtn').onclick=()=>{frames[index].canvas.toBlob(b=>{if(b)download(b,`frame-${String(index+1).padStart(3,'0')}.png`)},'image/png')};
$('importBtn').onclick=()=>$('fileInput').click();$('fileInput').onchange=e=>importImages(e.target.files);$('saveProjectBtn').onclick=saveProject;$('loadProjectBtn').onclick=()=>$('projectInput').click();$('projectInput').onchange=e=>openProject(e.target.files[0]);$('exportBtn').onclick=exportVideo;
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea')||exporting)return;const key=e.key.toLowerCase();if((e.ctrlKey||e.metaKey)&&key==='z'){e.preventDefault();if(e.shiftKey)redo();else undo();return}if((e.ctrlKey||e.metaKey)&&key==='y'){e.preventDefault();redo();return}if(e.ctrlKey||e.metaKey||e.altKey)return;if(key===' '){e.preventDefault();play()}else if(key==='arrowleft'){e.preventDefault();select(index-1)}else if(key==='arrowright'){e.preventDefault();select(index+1)}else{const map={b:'pencil',m:'marker',s:'spray',e:'eraser',l:'line',r:'rectangle'};if(map[key])document.querySelector(`[data-tool="${map[key]}"]`).click()}});
refresh();setStatus('Ready to draw!');
})();
</script>
</body>
</html>
